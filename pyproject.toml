[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "stagebridge"
version = "0.1.0"
description = "Transformer-first HLCA-aligned benchmark for stage-to-stage lung progression modeling"
requires-python = ">=3.9"
# Core runtime deps (always required)
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "scanpy>=1.10",       # sc.pp.normalize_total, highly_variable_genes, pca, umap
    "squidpy>=1.4",       # Visium loading, spatial neighbours, spatial autocorr
    "harmonypy>=0.0.9",   # Harmony batch correction across patients
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.65",
    "h5py>=3.9",
    "torch>=2.2",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "jupyterlab>=4.0",
    "nbconvert",
    "black",
    "ruff",
    "pytest",
    "pytest-cov",
]

# Deep learning + probabilistic single-cell
#   pip install -e ".[dl]"
dl = [
    "scvi-tools>=1.1.0",   # scVI, scANVI, TOTALVI, DestVI
]

# scRNA→spatial mapping and deconvolution
#   pip install -e ".[mapping]"
mapping = [
    "tangram-sc>=1.0.4",
    "cell2location>=0.1.3",
]

# SpatialData ecosystem (new Scverse format, Xenium/MERSCOPE support)
#   pip install -e ".[spatialdata]"
spatialdata = [
    "spatialdata>=0.1.0",
    "spatialdata-io>=0.1.0",
]

# Trajectory analysis and RNA velocity
#   pip install -e ".[trajectory]"
trajectory = [
    "scvelo>=0.3.1",
    "cellrank>=2.0",
]

# Doublet detection
#   pip install -e ".[qc]"
qc = [
    "scrublet>=0.2.3",
    "doubletdetection>=4.2",
]

# Everything (except cell2location — heavy install)
#   pip install -e ".[all]"
all = [
    "scvi-tools>=1.1.0",
    "tangram-sc>=1.0.4",
    "spatialdata>=0.1.0",
    "spatialdata-io>=0.1.0",
    "scvelo>=0.3.1",
    "cellrank>=2.0",
    "scrublet>=0.2.3",
    "doubletdetection>=4.2",
    "jupyter",
    "ipykernel",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stagebridge*"]

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.black]
line-length = 99
target-version = ["py39", "py310", "py311"]
