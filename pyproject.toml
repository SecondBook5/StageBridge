[project]
name = "stagebridge"
version = "1.0.0"
description = "Receiver-centered niche modeling for cell state transitions in spatial transcriptomics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AJ Book", email = "book@example.com"},
]
keywords = [
    "single-cell",
    "spatial-transcriptomics",
    "cancer",
    "deep-learning",
    "flow-matching",
    "optimal-transport",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.0",
    "anndata>=0.8",
    "scanpy>=1.9",
    "tqdm>=4.60",
    "POT>=0.9",  # Optimal transport
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1",
    "mypy>=1.0",
]
training = [
    "optuna>=3.0",
    "tensorboard>=2.10",
]
viz = [
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "umap-learn>=0.5",
    "phate>=1.0",
]
all = [
    "stagebridge[dev,training,viz]",
]

[project.urls]
Homepage = "https://github.com/SecondBook5/StageBridge"
Documentation = "https://github.com/SecondBook5/StageBridge#readme"
Repository = "https://github.com/SecondBook5/StageBridge"
Issues = "https://github.com/SecondBook5/StageBridge/issues"

[project.scripts]
stagebridge = "stagebridge.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stagebridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "contract: marks test as a contract test (enforces invariants)",
    "slow: marks test as slow running",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
