[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stagebridge"
version = "0.1.0"
description = "Transformer-based modeling of lung adenocarcinoma stage progression from spatial transcriptomics, single-cell RNA-seq, and whole-exome sequencing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
  {name = "AJ Book"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/SecondBook5/StageBridge"
Repository = "https://github.com/SecondBook5/StageBridge"
Issues = "https://github.com/SecondBook5/StageBridge/issues"

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "anndata>=0.10",
  "scanpy>=1.10",
  "squidpy>=1.4",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "tqdm>=4.65",
  "rich>=13.0",
  "pyyaml>=6.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "h5py>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pre-commit",
  "jupyterlab>=4.0",
  "ipykernel",
  "ipywidgets",
]
reference = [
  "scvi-tools>=1.1.0",
  "huggingface_hub>=0.20",
]
mapping = [
  "tangram-sc>=1.0.4",
]
ot = [
  "POT>=0.9.3",
  "geomloss>=0.2.6",
]
viz = [
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "plotly>=5.18",
  "kaleido>=0.2.1",
]
all = [
  "stagebridge[dev,reference,mapping,ot,viz]",
]

[project.scripts]
stagebridge = "stagebridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stagebridge*"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stagebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
