context_model:
  mode: typed_hierarchical_transformer
  graph_enabled: false
  token_types:
    - epithelial
    - stromal
    - immune
    - vascular
  hidden_dim: 160
  num_heads: 4
  num_inducing_points: 16
  num_group_summary_tokens: 3
  num_fusion_queries: 7
  dataset_embedding_dim: 16
  use_cross_attention_drift: true
  use_spatial_rpe: true
  use_confidence_gate: true
  token_dropout_rate: 0.03
  auxiliary_context_shuffle_weight: 0.1
  transfer_dataset: brainmets
  pretraining:
    enabled: true
    mask_fraction: 0.15
    masked_token_weight: 0.35
    ranking_weight: 0.35
    provider_consistency_weight: 0.15
    coordinate_corruption_weight: 0.10
    group_relation_weight: 0.05
    ranking_margin: 0.2
    max_epochs: 2
    steps_per_epoch: 4
    learning_rate: 0.0008
    weight_decay: 0.0001
    provider_consistency_enabled: true
    provider_methods:
      - tangram
      - tacco
      - destvi
  finetune:
    masked_token_weight: 0.05
    ranking_weight: 0.15
    provider_consistency_weight: 0.05
  communication_relay:
    enabled: true
    active_edges:
      - AAH->AIS
      - AIS->MIA
    max_cells_per_stage: 4096
    max_spots_per_stage: 4096
    max_receiver_cells_per_sample: 16
    max_anchor_spots: 4
    max_sender_spots: 24
    max_lr_tokens: 12
    num_distance_rings: 3
    hidden_dim: 128
    num_heads: 4
    dropout: 0.1
    learning_rate: 0.0005
    weight_decay: 0.0001
    grad_clip_norm: 1.0
    batch_size_bags: 4
    max_epochs: 8
    patience: 3
    prior_loss_weight: 0.05
    response_loss_weight: 0.05
    outer_folds: 3
    num_trials: 1
    seeds:
      - 42
    output_subdir: communication_relay
    curated_manifest_path: stagebridge/data/luad_evo/curated_progression_labels.csv
    model_families:
      - focal_only
      - pooled
      - deep_sets
      - graphsage
      - graph_transformer
      - transformer_no_priors
      - transformer_no_relay
      - stagebridge
