context_model:
  mode: set_only
  graph_enabled: false
  token_types:
    - epithelial
    - stromal
    - immune
    - vascular
  hidden_dim: 128
  num_heads: 8
  num_inducing_points: 16
  num_seed_vectors: 4
  use_spatial_rpe: true
  use_confidence_gate: true
  token_dropout_rate: 0.05
  auxiliary_context_shuffle_weight: 0.1
  use_cross_attention_drift: true
