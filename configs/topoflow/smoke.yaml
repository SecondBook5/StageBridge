# StageBridge TopoFlow — smoke test config (AAH → AIS only)
# Uses synthetic data, runs on CPU, completes in seconds.

data:
  synthetic: true
  n_cells: 50
  n_genes: 100

model:
  input_dim: 16
  hidden_dim: 32
  vector_field_hidden_dim: 64
  num_heads: 4
  num_inducing_points: 8
  num_seed_vectors: 1
  num_stages: 2
  time_embedding_dim: 16
  stage_embedding_dim: 16
  dropout: 0.1
  use_ot: true
  use_stage_embedding: true
  use_cross_attn_drift: false
  use_spatial_rpe: false
  use_graph_transformer: false

bridge:
  ot_epsilon: 0.1
  sinkhorn_iters: 30
  num_ot_pairs: 32
  sigma: 0.0
  use_stochastic_bridge: false
  context_consistency_weight: 0.0

training:
  learning_rate: 1.0e-3
  weight_decay: 0.0
  grad_clip_norm: 1.0
  max_epochs: 2
  steps_per_epoch: 3
  val_steps: 2
  patience: 5
  gradient_accumulation_steps: 1
  mixed_precision: false
  device: cpu
  seed: 42

stages:
  order: [AAH, AIS]
  extended: false

output:
  output_dir: outputs/runs
