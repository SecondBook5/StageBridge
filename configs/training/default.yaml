# configs/training/default.yaml
max_epochs: 150
steps_per_epoch: 50
val_steps: 10
batch_cells: 256
num_ot_pairs: 512
learning_rate: 0.001
weight_decay: 0.0001
grad_clip_norm: 1.0
gradient_accumulation_steps: 1
patience: 20
mixed_precision: true
ot_epsilon: 0.05
sinkhorn_iters: 80
context_consistency_weight: 0.1
use_ot: true
use_stage_embedding: true
seed: 42
device: cuda

# Optional transition restriction (null => use all adjacent transitions).
transition_src: null
transition_tgt: null

# Optional niche token integration.
use_niche_tokens: false
niche_token_bank_path: ${data.data_root}/processed/features/niche_token_bank.zarr
m_niche: 64
niche_sampling_strategy: random_m
niche_fallback: donor
niche_random_seed: 42
