# configs/training/smoke.yaml
# Smoke / CI training config — runs in seconds on CPU, no GPU required.
max_epochs: 2
steps_per_epoch: 2
val_steps: 1
batch_cells: 32
num_ot_pairs: 64
learning_rate: 0.001
weight_decay: 0.0001
grad_clip_norm: 1.0
gradient_accumulation_steps: 1
patience: 2
mixed_precision: false
ot_epsilon: 0.05
sinkhorn_iters: 5
context_consistency_weight: 0.1
use_ot: true
use_stage_embedding: true
sigma: 0.1
use_stochastic_bridge: false
use_cross_attn_drift: false
use_wes_features: false
lineage_filter: null
seed: 42
device: cpu

transition_src: null
transition_tgt: null

use_niche_tokens: false
niche_token_bank_path: ${data.data_root}/processed/features/niche_token_bank.zarr
m_niche: 16
niche_sampling_strategy: random_m
niche_fallback: donor
niche_random_seed: 42
