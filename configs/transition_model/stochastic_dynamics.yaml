transition_model:
  stochastic_dynamics:
    input_dim: 64
    hidden_dim: 128
    vector_field_hidden_dim: 256
    num_heads: 8
    num_inducing_points: 16
    num_seed_vectors: 1
    num_stages: 5
    time_embedding_dim: 32
    stage_embedding_dim: 32
    dropout: 0.1
    use_cross_attn_drift: true
    use_spatial_rpe: false
    state_dependent_diffusion: true
