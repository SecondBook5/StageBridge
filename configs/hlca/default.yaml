# configs/hlca/default.yaml
hub_repo_id: scvi-tools/human-lung-cell-atlas-scanvi
surgery_epochs: 500
batch_size_infer: 1024
early_stopping: true
early_stopping_monitor: elbo_train
early_stopping_patience: 10
early_stopping_min_delta: 0.001
weight_decay: 0.0
train_max_cells: 200000
query_dataset_mode: donor
query_dataset_constant: stagebridge_query
export_probs: false
uncertainty_threshold: 0.2
knn_label_transfer_levels: false
label_levels:
  - ann_level_1
  - ann_level_2
  - ann_level_3
  - ann_level_4
  - ann_level_5
  - ann_finest_level

# Performance/resume knobs.
inference_chunk_size: 8192
resume: true
dense_max_elements: 200000000
keep_intermediates: false
model_cache_dir: ${data.output_processed_hlca_dir}/hub_cache
query_model_dir: ${data.output_processed_hlca_dir}/query_model_full
show_progress: true
