# Gromov-Wasserstein Fusion HPO Sweep
# Usage: python scripts/train.py --config-name=config --multirun hydra/sweeper=optuna +sweep=gw_hpo
#
# Key hyperparameters to tune:
# - gw_output_dim: Fused representation dimension (40-128)
# - gw_sinkhorn_reg: Entropic regularization (0.01-1.0, log scale)
# - gw_sinkhorn_iters: Sinkhorn iterations (20-100)
# - gw_mode: Fusion mode (barycentric, project_to_hlca, project_to_luca)

defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
    direction: minimize
    n_trials: 50
    n_jobs: 4

    params:
      # GW Fusion parameters
      model.use_gw_fusion: choice(true)
      model.gw_output_dim: choice(40, 64, 96, 128)
      model.gw_sinkhorn_reg: interval(0.01, 1.0)  # Log scale recommended
      model.gw_sinkhorn_iters: range(20, 100, step=10)
      model.gw_mode: choice(barycentric, project_to_hlca, project_to_luca)

      # Also tune core model params alongside
      model.hidden_dim: choice(128, 256, 384)
      model.num_heads: choice(4, 8)
      model.dropout: interval(0.05, 0.3)

      # Learning rate
      trainer.learning_rate: interval(1e-5, 1e-3)
