spatial_mapping:
  method: tangram
  execution_mode: load_precomputed
  label_col: hlca_label
  device: auto
  learning_rate: 0.1
  num_epochs: 500
  density_prior: rna_count_based
  aggregate_profiles: true
  min_label_coverage: 0.9
  min_cells_per_label: 20
  max_training_genes: 3000
  max_reference_cells_per_label: 4000
  verbose: true
