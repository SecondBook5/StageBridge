# configs/model/stagebridge.yaml

_target_: stagebridge.models.stagebridge.StageBridgeModel

config:
  _target_: stagebridge.models.stagebridge.StageBridgeConfig

  # Model dims
  input_dim: 64
  hidden_dim: 128
  vector_field_hidden_dim: 256

  # Set Transformer knobs
  num_heads: 8
  num_inducing_points: 16
  num_seed_vectors: 1

  # Conditioning knobs
  num_stages: 5
  time_embedding_dim: 32
  stage_embedding_dim: 32

  # Regularization
  dropout: 0.1

  # Spatial RPE (disabled by default)
  use_spatial_rpe: false
  rpe_hidden_dim: 16

  # ── Tier 3 features ────────────────────────────────────

  # LR signaling conditioning
  use_lr_features: false
  lr_feature_dim: 24
  lr_hidden_dim: 32

  # Spatial niche composition conditioning
  use_spatial_niche: false
  spatial_niche_dim: 20
  spatial_niche_hidden: 32

  # Dirichlet stage assignment posterior
  use_dirichlet_head: false
  dirichlet_hidden_dim: 64
  dirichlet_loss_weight: 0.05

  # Multi-hop skip-stage consistency
  use_multihop_consistency: false
  multihop_consistency_weight: 0.1

  # ── Graph-of-Sets Transformer (GoST) ──────────────────
  use_graph_transformer: false
  graph_num_layers: 2
  graph_num_heads: 4