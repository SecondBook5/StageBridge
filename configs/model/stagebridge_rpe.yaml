# configs/model/stagebridge_rpe.yaml
# StageBridge with Spatial RPE in ISAB1 — for niche-token + spatial-coordinate runs.

_target_: stagebridge.models.stagebridge.StageBridgeModel

defaults:
  - stagebridge  # inherit all base settings

config:
  _target_: stagebridge.models.stagebridge.StageBridgeConfig

  # Model dims (same as base)
  input_dim: 64
  hidden_dim: 128
  vector_field_hidden_dim: 256

  # Set Transformer knobs (same as base)
  num_heads: 8
  num_inducing_points: 16
  num_seed_vectors: 1

  # Conditioning knobs (same as base)
  num_stages: 5
  time_embedding_dim: 32
  stage_embedding_dim: 32

  # Regularization (same as base)
  dropout: 0.1

  # Spatial RPE enabled
  use_spatial_rpe: true
  rpe_hidden_dim: 16
