run_name: stagebridge_v1
output_dir: outputs/scratch
seed: 42

profiles:
  data: luad_evo
  spatial_mapping: tangram
  context_model: set_only
  splits: donor_holdout
  train: full_v1
  evaluation: baseline

spatial_mapping:
  selected_provider: tangram
  selection_status: provisional
  selection_reason: benchmark_not_run

context_model:
  use_spatial_rpe: true
  use_confidence_gate: true
  token_dropout_rate: 0.05
  auxiliary_context_shuffle_weight: 0.1

reference:
  method: hlca
  latent_backend: hlca
  latent_key: X_hlca
  label_key: hlca_label
  n_components: 32
  reference_h5ad: /mnt/e/StageBridge_data/data/reference/hlca/hlca_full_v1.h5ad
