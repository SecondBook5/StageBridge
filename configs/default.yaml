run_name: stagebridge_v1
output_dir: outputs/scratch
seed: 42

profiles:
  data: luad_evo
  spatial_mapping: tangram
  context_model: set_only
  splits: donor_holdout
  train: full_v1
  evaluation: baseline

spatial_mapping:
  selected_provider: tangram
  selection_status: provisional
  selection_reason: benchmark_not_run

context_model:
  use_spatial_rpe: true
  use_confidence_gate: true
  token_dropout_rate: 0.05
  auxiliary_context_shuffle_weight: 0.1

# SSL pretraining loss weights (can be tuned via HPO)
ssl_loss_weights:
  masked_token: 0.70      # PRIMARY - receiver reconstruction from niche
  ranking: 0.10           # Auxiliary - positive vs negative discrimination
  provider_consistency: 0.10  # Auxiliary - cross-view consistency
  coordinate_corruption: 0.05  # Auxiliary - spatial awareness
  group_relation: 0.05    # Auxiliary - biological group structure

# Fusion strategy for dual-reference embeddings
fusion:
  method: concat  # Options: concat, average, weighted, learned
  learned_init_hlca_weight: 0.5  # Initial weight for HLCA (learned fusion only)
  normalize: true

reference:
  method: hlca
  latent_backend: hlca
  latent_key: X_hlca
  label_key: hlca_label
  n_components: 32
  reference_h5ad: ${oc.env:STAGEBRIDGE_DATA_ROOT,./data}/data/reference/hlca/hlca_full_v1.h5ad
