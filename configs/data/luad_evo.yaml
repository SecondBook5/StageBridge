data:
  dataset: luad_evo
  data_root: ${oc.env:STAGEBRIDGE_DATA_ROOT,./data}
  snrna_h5ad: ${data.data_root}/interim/anndata/snrna/snrna_full.h5ad
  snrna_latent_h5ad: ${data.data_root}/processed/anndata/snrna_hlca_latent_full.h5ad
  spatial_h5ad: ${data.data_root}/interim/anndata/spatial/spatial_full.h5ad
  spatial_tangram_h5ad: ${data.data_root}/processed/tangram/spatial_tangram_full.h5ad
  tangram_scores_parquet: ${data.data_root}/processed/tangram/spatial_tangram_celltype_scores.parquet
  niche_token_bank_zarr: ${data.data_root}/processed/features/niche_token_bank.zarr
  hlca_h5ad: ${data.data_root}/data/reference/hlca/hlca_full_v1.h5ad
  wes_features_path: ${data.data_root}/processed/features/wes_features.parquet
  stage_col: stage
  donor_col: donor_id
  sample_col: sample_id
  latent_key: X_hlca
