# StageBridge Path Configuration
# Switch between environments by setting STAGEBRIDGE_ENV environment variable
# Usage: export STAGEBRIDGE_ENV=hpc  (or "local")

local:
  data_root: ~/data/stagebridge/processed
  hlca_dir: ~/data/stagebridge/processed/HLCA
  luca_dir: ~/data/stagebridge/processed/LuCA
  evo_dir: ~/data/stagebridge/processed/luad_evo
  output_dir: ./data/outputs/v1_demo
  results_dir: ./results
  figures_dir: ./figures

hpc:
  data_root: /data1/chaunzt1/stagebridge/processed
  hlca_dir: /data1/chaunzt1/stagebridge/processed/HLCA
  luca_dir: /data1/chaunzt1/stagebridge/processed/LuCA
  evo_dir: /data1/chaunzt1/stagebridge/processed/luad_evo
  output_dir: /data1/chaunzt1/stagebridge/outputs/v1_demo
  results_dir: /data1/chaunzt1/stagebridge/results
  figures_dir: /data1/chaunzt1/stagebridge/figures

# Expected files in each directory:
# hlca_dir/hlca_scanvi.h5ad (or download via scvi-tools)
# luca_dir/luca_extended.h5ad
# evo_dir/snrna_merged.h5ad
