# configs/tangram/default.yaml
mode: clusters
label_col: hlca_label
device: auto
learning_rate: 0.1
num_epochs: 500
density_prior: rna_count_based
random_seed: 42
scale: true
lambda_d: 0.0
lambda_g1: 1.0
lambda_g2: 0.0
lambda_r: 0.0
verbose: true
show_progress: true
cuda_retry_on_failure: true
cuda_max_retries: 1
cuda_retry_sleep_seconds: 2.0
cuda_clear_cache_before_map: true

# StageBridge wrapper knobs
aggregate_profiles: true
aggregate_chunk_rows: 20000
use_counts_layer: true
min_label_coverage: 0.9
min_cells_per_label: 20
max_training_genes: 3000
min_shared_genes: 300
