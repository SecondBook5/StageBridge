name: full_benchmark
cross_validate: true
primary_model: stagebridge
baseline_models:
  - deepsets
  - no_context
  - linear
variants:
  - stagebridge_sb        # StageBridge + SB-CFM (stochastic bridge, sigma=0.1)
  - stagebridge_xattn_sb  # StageBridge + cross-attention drift + SB-CFM (headline variant)
  - stagebridge_wes       # StageBridge + WES somatic features + SB-CFM
  - stagebridge_xattn_wes # Full model: cross-attn drift + WES features + SB-CFM

  # ── Tier 3: advanced variants ──────────────────────────
  - stagebridge_lr         # StageBridge + LR signaling features + SB-CFM
  - stagebridge_spatial    # StageBridge + spatial niche conditioning + SB-CFM
  - stagebridge_dirichlet  # StageBridge + Dirichlet stage head + SB-CFM
  - stagebridge_multihop   # StageBridge + multi-hop consistency + SB-CFM
  - stagebridge_full_t3    # Full Tier 3: xattn + WES + LR + spatial + Dirichlet + multihop

  # ── Graph-of-Sets Transformer (GoST) ─────────────────
  - stagebridge_gost       # StageBridge + GoST inter-set context + SB-CFM
  - stagebridge_gost_xattn # GoST + cross-attention drift + SB-CFM

ablations:
  - no_ot
  - no_context
  - no_stage_embedding
  - no_context_consistency
  - no_lr_features         # Tier 3: ablate LR conditioning
  - no_spatial_niche       # Tier 3: ablate spatial niche
  - no_dirichlet           # Tier 3: ablate Dirichlet head
  - no_multihop            # Tier 3: ablate multi-hop consistency
