name: stagebridge
channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - pip

  # Core
  - numpy
  - scipy
  - pandas
  - scikit-learn

  # Single-cell + spatial
  - anndata
  - scanpy
  - squidpy
  - leidenalg
  - python-igraph

  # OT + utilities
  - pot
  - geomloss
  - tqdm
  - rich
  - pyyaml
  - hydra-core
  - omegaconf
  - joblib
  - psutil
  - requests

  # Jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets

  # Plotting
  - matplotlib
  - seaborn
  - plotly
  - python-kaleido

  # I/O
  - h5py
  - pyarrow
  - zarr
  - numcodecs

  # Embeddings
  - umap-learn
  - pynndescent
  - numba
  - harmonypy

  # Spatial image deps (needed for Squidpy image tooling and many ST QC plots)
  - scikit-image
  - pillow
  - opencv

  # Dev
  - pytest
  - ruff
  - pre-commit

  # Pip-only packages (installed after conda deps)
  - pip:
      - scvi-tools
      - tangram-sc
      - huggingface_hub