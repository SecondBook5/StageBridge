run_name: stagebridge_v1
output_dir: outputs/scratch
seed: 42
profiles:
  data: luad_evo
  spatial_mapping: tangram
  context_model: set_only
  splits: donor_holdout
  train: full_v1
  evaluation: baseline
reference:
  method: hlca
  latent_key: X_hlca
  label_key: hlca_label
  reference_h5ad: /mnt/e/StageBridge_data/data/reference/hlca/hlca_full_v1.h5ad
data:
  dataset: luad_evo
  data_root: /mnt/e/StageBridge_data
  snrna_h5ad: /mnt/e/StageBridge_data/processed/anndata/snrna_merged.h5ad
  spatial_h5ad: /mnt/e/StageBridge_data/processed/anndata/spatial_merged.h5ad
  hlca_h5ad: /mnt/e/StageBridge_data/data/reference/hlca/hlca_full_v1.h5ad
  wes_features_path: /mnt/e/StageBridge_data/processed/features/wes_features.parquet
  stage_col: stage
  donor_col: patient_id
  sample_col: sample_id
  latent_key: X_hlca
spatial_mapping:
  method: tangram
  label_col: hlca_label
  device: auto
  learning_rate: 0.1
  num_epochs: 500
  density_prior: rna_count_based
  aggregate_profiles: true
  min_label_coverage: 0.9
  min_cells_per_label: 20
  max_training_genes: 3000
context_model:
  mode: set_only
  graph_enabled: false
  token_types:
  - epithelial
  - stromal
  - immune
  - vascular
  hidden_dim: 128
  num_heads: 8
  num_inducing_points: 16
  num_seed_vectors: 1
splits:
  name: donor_holdout
  n_folds: 3
  min_stages_per_donor: 2
  stage_coverage_required: true
train:
  profile: smoke
  max_epochs: 2
  steps_per_epoch: 2
  val_steps: 1
  batch_cells: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  mixed_precision: false
  device: cpu
  seed: 42
evaluation:
  profile: baseline
  report_level: baseline
  ablations: []
transition_model:
  disease_edges:
  - - Normal
    - AAH
  - - AAH
    - AIS
  - - AIS
    - MIA
  - - MIA
    - LUAD
  gaussian_init:
    sigma: 0.1
  stochastic_dynamics:
    input_dim: 64
    hidden_dim: 128
    vector_field_hidden_dim: 256
    num_heads: 8
    num_inducing_points: 16
    num_seed_vectors: 1
    num_stages: 5
    time_embedding_dim: 32
    stage_embedding_dim: 32
    dropout: 0.1
    use_cross_attn_drift: true
    use_spatial_rpe: false
    state_dependent_diffusion: true
  schrodinger_bridge:
    enabled: true
    ot_epsilon: 0.05
    sinkhorn_iters: 80
    num_ot_pairs: 512
    sigma: 0.1
  wes_regularizer:
    enabled: true
    mode: regularizer
    feature_path: /mnt/e/StageBridge_data/processed/features/wes_features.parquet
    strength: 0.1
