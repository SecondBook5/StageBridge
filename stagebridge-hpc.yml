name: stagebridge
channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # Core
  - numpy
  - scipy
  - pandas
  - scikit-learn

  # Single-cell
  - anndata
  - scanpy
  - leidenalg
  - python-igraph

  # Config & optimization
  - omegaconf
  - hydra-core
  - optuna

  # Utilities
  - pot
  - tqdm
  - pyyaml
  - joblib
  - psutil

  # Plotting
  - matplotlib
  - seaborn

  # I/O
  - h5py
  - pyarrow
  - zarr

  # Embeddings
  - umap-learn

  # Pip-only (installed after)
  - pip:
      - scvi-tools
      - torch
      - huggingface_hub
