name: r_deconv
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base>=4.2
  - r-matrix
  - r-remotes
  - r-devtools
  - r-biocmanager
  - r-rcpp
  - r-rcpparmadillo
  - r-rcppeigen
  - r-fields
  - r-rann
  - r-pbmcapply
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-stringr
  - r-data.table
  # Bioconductor dependencies
  - bioconductor-singlecellexperiment
  - bioconductor-spatialexperiment
  - bioconductor-scater
  - bioconductor-scran
  - bioconductor-scuttle
  - bioconductor-toast  # Required by MuSiC
  # NOTE: MuSiC (required by CARD) must be installed manually after env creation:
  # R -e "devtools::install_github('xuranw/MuSiC')"
  # Spatial deconvolution packages
  - bioconductor-spotlight
  - r-spacexr  # RCTD
  - r-card
