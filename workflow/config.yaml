# =============================================================================
# StageBridge V1 Pipeline Configuration
# =============================================================================

# Data paths (override via: snakemake --config data_root=/your/path)
data_root: "/scratch/chaunzt1/stagebridge"

# Reference mapping parameters
# NOTE: These dimensions are fixed by the pretrained reference atlas models.
# Canonical values defined in: stagebridge/config.py
hlca:
  latent_key: "X_scanvi_emb"
  latent_dim: 30  # Fixed by HLCA scANVI model
  surgery_epochs: 200

luca:
  latent_key: "X_scANVI"
  latent_dim: 10  # Fixed by LuCA scVI model
  surgery_epochs: 200

# Derived: fused_latent_dim = hlca.latent_dim + luca.latent_dim = 40
# This is the input dimension for the StageBridge model.

# Spatial backend parameters
spatial:
  backends:
    - tangram
    - destvi
    - tacco
    - cell2location
  canonical_selection: "auto"  # or specify: "tangram"

# Training parameters
training:
  ssl_epochs: 100
  transition_epochs: 50
  batch_size: 256
  learning_rate: 0.0001
  hidden_dim: 128  # Model internal hidden dimension (tunable)
  context_dim: 256  # Context projection dimension (tunable)
  n_gpus: 4
  checkpoint_every: 10
  early_stopping_patience: 20

# Ablation studies
ablations:
  - no_niche
  - pooled_niche
  - no_hierarchy
  - no_hlca
  - no_luca
  - single_reference
  - no_attention
  - no_flow
  - deterministic
  - no_genomics
  - no_uncertainty
  - reduced_latent
  - no_ssl
  - baseline_mlp

# Publication figures
figures:
  dpi: 300
  formats:
    - png
    - pdf
    - svg
  style: "publication"
