# =============================================================================
# StageBridge Pipeline Configuration
# =============================================================================
# Override via: snakemake --config data_root=/your/path
# Or set STAGEBRIDGE_ENV=local for local development

# =============================================================================
# Paths
# =============================================================================

# HPC paths (default)
paths:
  data_root: "/data1/chaunzt1/stagebridge"
  # Canonical dataset (preprocessed with progression scores)
  data_dir: "/data1/chaunzt1/stagebridge/processed/luad_evo/canonical"
  output_dir: "/data1/chaunzt1/stagebridge/outputs/v1.1"
  results_dir: "/data1/chaunzt1/stagebridge/results"
  figures_dir: "/data1/chaunzt1/stagebridge/figures"
  hlca_dir: "/data1/chaunzt1/stagebridge/processed/HLCA"
  luca_dir: "/data1/chaunzt1/stagebridge/processed/LuCA"
  # Raw input for data preparation (if rebuilding from scratch)
  # Set to null by default to avoid cyclic dependencies. Override when running prepare_data:
  #   snakemake prepare_data --config raw_cells=/path/to/raw_cells.parquet
  raw_cells: null  # "/data1/chaunzt1/stagebridge/processed/luad_evo/raw/cells.parquet"
  # DestVI deconvolution results
  destvi_luca: "/data1/chaunzt1/stagebridge/runs/spatial_benchmark/luca/destvi/cell_type_proportions.parquet"
  destvi_hlca: "/data1/chaunzt1/stagebridge/runs/spatial_benchmark/hlca/destvi/cell_type_proportions.parquet"
  # Expression data for LIANA/SCENIC (if needed)
  snrna_h5ad: "/data1/chaunzt1/stagebridge/processed/luad_evo/snrna_with_celltypes.h5ad"
  spatial_h5ad: "/data1/chaunzt1/stagebridge/processed/luad_evo/spatial_merged.h5ad"
  # Precomputed progression scores
  progression_scores: "/data1/chaunzt1/stagebridge/processed/luad_evo/canonical/progression/progression_scores.parquet"
  # Evolution features (WES + clonal from inferCNV)
  evolution_features: "/data1/chaunzt1/stagebridge/processed/luad_evo/evolution_features.parquet"
  # Clone assignments (for computing niche-level clonal features)
  clone_assignments: "/data1/chaunzt1/stagebridge/processed/luad_evo/clone_assignments.parquet"

# Reference atlas configuration
# NOTE: Latent dimensions are fixed by pretrained models
hlca:
  latent_key: "X_scanvi_emb"
  latent_dim: 30  # Fixed by HLCA scANVI model

luca:
  latent_key: "X_scANVI"
  latent_dim: 10  # Fixed by LuCA scVI model

# Derived: fused_latent_dim = 30 + 10 = 40 (LATENT_DIM in contracts.py)

# =============================================================================
# Gromov-Wasserstein Precomputation
# =============================================================================

gw_precompute:
  # Whether to use pretrained GW fusion (requires precompute_gw rule)
  use_pretrained: true
  # Number of reference cells for GW computation (stratified by stage/celltype)
  n_reference_cells: 5000
  # Sinkhorn entropic regularization
  sinkhorn_reg: 0.05
  # GW alternating optimization iterations
  gw_iters: 50

# =============================================================================
# Experiment Settings
# =============================================================================

experiment:
  n_folds: 5
  n_seeds: 3
  seed: 42

# =============================================================================
# Model Settings
# =============================================================================

model:
  input_dim: 40           # hlca.latent_dim + luca.latent_dim
  hidden_dim: 128
  num_heads: 4
  num_encoder_layers: 2
  use_amici_attention: true  # AMICI format: continuous distance attention (preferred)
  use_learned_ring_pooling: false  # Disabled when using AMICI
  use_context_refiner: true
  # Gromov-Wasserstein atlas fusion
  # Options: false (concat), "learned_projection", "pretrained"
  # "pretrained" requires precompute_gw rule to run first
  use_gw_fusion: true
  gw_fusion_type: pretrained  # Use precomputed GW alignment (proper method)
  gw_output_dim: 64           # Fused reference dimension
  # Evolution branch (WES + clonal conditioning)
  use_evolution_branch: true
  evolution_dim: 30       # EVOLUTION_DIM from contracts (17 WES + 13 clonal)
  evolution_mode: gated   # gated or film

# =============================================================================
# Training Settings
# =============================================================================

trainer:
  # Two-stage training
  ssl_epochs: 50
  transition_epochs: 100

  # Learning rate
  learning_rate: 1e-4
  weight_decay: 1e-5
  warmup_epochs: 5
  min_lr: 1e-6
  transition_lr_factor: 0.1

  # Batch size
  batch_size: 64

  # Checkpointing
  checkpoint_every: 10
  eval_every: 1

  # Early stopping
  early_stopping_enabled: true
  early_stopping_patience: 20

# =============================================================================
# Hyperparameter Optimization
# =============================================================================

hpo:
  n_trials: 30           # Number of Optuna trials
  n_epochs_per_trial: 10 # Training epochs per trial
  time: "12:00:00"       # SLURM time limit

# =============================================================================
# Baselines
# =============================================================================

baselines:
  - pooling
  - deepsets
  - set_transformer
  - graphsage

# =============================================================================
# Ablations
# =============================================================================

ablations:
  # Key ablations for publication
  # Full ablation list preserved in comments for future runs

  # Core novelty: does niche context help?
  - no_niche             # Remove niche context entirely (receiver only)
  - no_distance          # Remove distance-weighted attention (uniform over neighbors)

  # Dual reference: do we need both HLCA and LuCA?
  - hlca_only            # Only HLCA reference (zero out LuCA token)
  - luca_only            # Only LuCA reference (zero out HLCA token)

  # Additional ablations (commented out - HPO/other evidence covers these):
  # - no_gw_fusion       # HPO proved learned_gw > concat (Trial 11, loss 0.00345)
  # - no_distance        # Remove distance-based attention
  # - no_gate            # Remove cross-attention drift (use MLP)
  # - random_niche       # Shuffle niche assignments to test spatial structure
  # - frozen_encoder     # Freeze encoder during transition training
  # - no_ring_pooling    # Mean pooling instead of ISAB+PMA
  # - no_context_refiner # Remove HierarchicalSetTransformer
  # - gw_learned         # Learned projection (no precomputed GW)
  # - no_evolution       # Remove WES/clonal features

# =============================================================================
# SLURM Resources
# =============================================================================

resources:
  partition: "gpu"
  account: "chaunzt1"

  # Default resources
  default_gpu: 1
  default_time: "24:00:00"
  default_mem_mb: 256000

  # Job-specific overrides
  train_full:
    gpu: 1
    time: "48:00:00"
    mem_mb: 256000

  train_baseline:
    gpu: 1
    time: "12:00:00"
    mem_mb: 256000

  inference:
    gpu: 1
    time: "4:00:00"
    mem_mb: 256000

  evaluation:
    gpu: 0
    time: "2:00:00"
    mem_mb: 256000

# =============================================================================
# Figures
# =============================================================================

figures:
  dpi: 300
  formats:
    - png
    - pdf
  style: "publication"
