# Snakemake 8+ SLURM Profile for StageBridge
# Usage: snakemake --profile workflow/slurm

executor: slurm

default-resources:
  slurm_account: chaunzt1
  slurm_partition: gpu
  mem_mb: 64000
  runtime: 360  # 6 hours default (in minutes)

# Request H100 GPUs when gpu resource is specified
set-resources:
  spatial_backend:
    slurm_extra: "'--constraint=h100'"
  training:
    slurm_extra: "'--constraint=h100'"
  baseline:
    slurm_extra: "'--constraint=h100'"
  ablation:
    slurm_extra: "'--constraint=h100'"
  hpo:
    slurm_extra: "'--constraint=h100'"
  hlca_mapping:
    slurm_extra: "'--constraint=h100'"
  luca_mapping:
    slurm_extra: "'--constraint=h100'"

jobs: 20
latency-wait: 120
keep-going: true
printshellcmds: true
rerun-incomplete: true
local-cores: 1
