# Snakemake SLURM Profile for StageBridge
# Usage: snakemake --profile workflow/slurm

cluster: "mkdir -p logs/{rule} && sbatch --account=chaunzt1 --partition={resources.partition} --gres=gpu:{resources.gpu} --mem={resources.mem_mb}M --cpus-per-task={threads} --time={resources.time} --job-name=sb_{rule} --output=logs/{rule}/%j.out --error=logs/{rule}/%j.err --parsable"
jobs: 20
latency-wait: 60
default-resources: [partition=gpu, mem_mb=64000, gpu=0, time="2:00:00"]
