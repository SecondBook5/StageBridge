# Snakemake 8+ SLURM Profile for StageBridge
# Usage: snakemake --profile workflow/slurm

executor: slurm

default-resources:
  slurm_account: chaunzt1
  slurm_partition: gpu
  mem_mb: 256000
  runtime: 360  # 6 hours default (in minutes)
  nodes: 1  # Always request single node (multi-GPU on same node)

# GPU constraint (comment out for any GPU, uncomment for H100)
# set-resources:
#   train_full:
#     constraint: "h100"
#   train_baseline:
#     constraint: "h100"
#   run_ablation:
#     constraint: "h100"
#   infer_full:
#     constraint: "h100"

jobs: 20
latency-wait: 120
keep-going: true
printshellcmds: true
rerun-incomplete: true
local-cores: 1

# Note: GPU requests are in Snakefile rule resources (gpu=1)
