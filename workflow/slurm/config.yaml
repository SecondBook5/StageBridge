# Snakemake 8+ SLURM Profile for StageBridge
# Usage: snakemake --profile workflow/slurm

executor: slurm

default-resources:
  slurm_account: chaunzt1
  slurm_partition: gpu
  mem_mb: 256000
  runtime: 360  # 6 hours default (in minutes)
  nodes: 1  # Always request single node (multi-GPU on same node)
  slurm_extra: "'--gres=gpu:1'"  # Default 1 GPU

# Override GPU count per rule
set-resources:
  train_full:
    slurm_extra: "'--gres=gpu:4'"

jobs: 20
latency-wait: 120
keep-going: true
printshellcmds: true
rerun-incomplete: true
local-cores: 1
