# Snakemake 8+ SLURM Profile for StageBridge
# Usage: snakemake --profile workflow/slurm

executor: slurm

default-resources:
  slurm_account: chaunzt1
  slurm_partition: gpu
  mem_mb: 64000
  runtime: 360  # 6 hours default (in minutes)

# GPU constraint (comment out for any GPU, uncomment for H100)
# set-resources:
#   spatial_backend:
#     constraint: "h100"
#   training:
#     constraint: "h100"
#   baseline:
#     constraint: "h100"
#   ablation:
#     constraint: "h100"
#   hpo:
#     constraint: "h100"
#   hlca_mapping:
#     constraint: "h100"
#   luca_mapping:
#     constraint: "h100"

jobs: 20
latency-wait: 120
keep-going: true
printshellcmds: true
rerun-incomplete: true
local-cores: 1

# Group jobs into SLURM arrays for efficient scheduling
# Groups jobs that differ only by 'sample' wildcard into array jobs
group-components:
  spatial_array: 9  # 9 samples per array job
