# Snakemake 8+ SLURM Profile for StageBridge
# Usage: snakemake --profile workflow/slurm

executor: slurm

# Activate conda environment for all jobs
default-resources:
  slurm_account: chaunzt1
  slurm_partition: gpu
  mem_mb: 64000
  runtime: 360  # 6 hours default (in minutes)

jobs: 20
latency-wait: 120
keep-going: true
printshellcmds: true
rerun-incomplete: true
local-cores: 1

# Ensure conda environment is activated for all shell commands
shell: "source /scratch/chaunzt1/stagebridge_env/bin/activate && "
