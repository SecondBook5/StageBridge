# Snakemake 8+ SLURM Profile for StageBridge
# Usage: snakemake --profile workflow/slurm

executor: slurm

default-resources:
  slurm_account: chaunzt1
  slurm_partition: gpu
  mem_mb: 64000
  runtime: 1440  # 24 hours default (in minutes)
  nodes: 1

# Override resources per rule type
set-resources:
  train_full:
    runtime: 2880  # 48 hours
    mem_mb: 64000
    slurm_extra: "'--gres=gpu:1'"
  train_baseline:
    runtime: 720  # 12 hours
    mem_mb: 32000
    slurm_extra: "'--gres=gpu:1'"
  run_ablation:
    runtime: 1440  # 24 hours
    mem_mb: 64000
    slurm_extra: "'--gres=gpu:1'"
  infer_full:
    runtime: 240  # 4 hours
    mem_mb: 32000
    slurm_extra: "'--gres=gpu:1'"
  evaluate_full:
    runtime: 120  # 2 hours
    mem_mb: 16000
  comparison_report:
    runtime: 30
    mem_mb: 4000
  run_inference_for_figures:
    runtime: 240  # 4 hours
    mem_mb: 32000
    slurm_extra: "'--gres=gpu:1'"

# Job management
jobs: 20
latency-wait: 120
keep-going: true
printshellcmds: true
rerun-incomplete: true
local-cores: 1

# Log directory
cluster-generic-submit-cmd: "sbatch --output=logs/slurm/%j.out --error=logs/slurm/%j.err"
