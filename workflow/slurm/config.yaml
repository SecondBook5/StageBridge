# Snakemake 9.17 SLURM Profile for StageBridge
# Usage: snakemake --profile workflow/slurm

executor: slurm

default-resources:
  slurm_account: chaunzt1
  slurm_partition: gpu
  mem_mb: 256000
  runtime: 360  # 6 hours default (in minutes)
  nodes: 1
  tasks: 1
  cpus_per_task: 4
  gpu: 1

# Override GPU count per rule
set-resources:
  train_full:
    gpu: 1
    tasks: 1
    runtime: 1440  # 24 hours

jobs: 20
latency-wait: 120
keep-going: true
printshellcmds: true
rerun-incomplete: true
local-cores: 1
